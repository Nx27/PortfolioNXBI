name: Build and Deploy Blazor WASM to Azure Static Web Apps

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # 3. Install WebAssembly tools (needed for Blazor)
      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      # 4. Restore dependencies
      - name: Restore
        run: dotnet restore

      # 5. Build + publish Blazor app
      - name: Publish
        run: dotnet publish -c Release

      # 6. Deploy to Azure Static Web Apps
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          app_artifact_location: "bin/Release/net8.0/publish/wwwroot"
